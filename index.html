// ---------------- Color & Theme Engine ----------------
const THEME_PRESETS = {
  indigo: { id:'indigo', hex:'#6366f1', accent:'#a855f7', nameEn:'Indigo',  nameFa:'نیلی (پیش‌فرض)' },
  blue:   { id:'blue',   hex:'#2563eb', accent:'#06b6d4', nameEn:'Blue',    nameFa:'آبی آسمانی' },
  purple: { id:'purple', hex:'#9333ea', accent:'#ec4899', nameEn:'Purple',  nameFa:'بنفش سلطنتی' },
  green:  { id:'green',  hex:'#10b981', accent:'#14b8a6', nameEn:'Green',   nameFa:'سبز زمردی' },
  orange: { id:'orange', hex:'#f97316', accent:'#eab308', nameEn:'Orange',  nameFa:'نارنجی پرانرژی' },
  pink:   { id:'pink',   hex:'#ec4899', accent:'#f43f5e', nameEn:'Pink',    nameFa:'صورتی مدرن' },
  teal:   { id:'teal',   hex:'#0d9488', accent:'#06b6d4', nameEn:'Teal',    nameFa:'فیروزه‌ای' }
};

function hexToRgb(hex){
  hex = String(hex||'').replace('#','').trim();
  if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(hex)) return [99,102,241];
  const n = parseInt(hex,16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');
}
function mixRgb(c1,c2,weight){
  return [
    Math.round(c1[0]*(1-weight)+c2[0]*weight),
    Math.round(c1[1]*(1-weight)+c2[1]*weight),
    Math.round(c1[2]*(1-weight)+c2[2]*weight)
  ];
}
function getLuminance(r,g,b){
  const a = [r,g,b].map(v=>{
    v /= 255;
    return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return a[0]*0.2126 + a[1]*0.7152 + a[2]*0.0722;
}
function buildPalette(hex){
  const base = hexToRgb(hex);
  const white = [255,255,255];
  const black = [12,15,28];
  const shades = {
    50:  mixRgb(base, white, 0.92),
    100: mixRgb(base, white, 0.84),
    200: mixRgb(base, white, 0.68),
    300: mixRgb(base, white, 0.46),
    400: mixRgb(base, white, 0.22),
    500: base,
    600: mixRgb(base, black, 0.12),
    700: mixRgb(base, black, 0.28),
    800: mixRgb(base, black, 0.45),
    900: mixRgb(base, black, 0.62)
  };
  const c600 = shades[600];
  const lum = getLuminance(c600[0],c600[1],c600[2]);
  const contrast = lum > 0.44 ? '#0f172a' : '#ffffff';
  const accentRgb = [
    Math.min(255, Math.round(base[0]*0.75 + 60)),
    Math.max(40,  Math.round(base[1]*0.65)),
    Math.min(255, Math.round(base[2]*0.85 + 40))
  ];
  return {
    shades,
    hex: rgbToHex(base[0],base[1],base[2]),
    hexDark: rgbToHex(c600[0],c600[1],c600[2]),
    accent: rgbToHex(accentRgb[0],accentRgb[1],accentRgb[2]),
    contrast
  };
}
function applyPrimaryVariables(hex, customAccent){
  const pal = buildPalette(hex);
  const root = document.documentElement.style;
  Object.entries(pal.shades).forEach(([k,rgb])=>{
    root.setProperty(`--p-${k}`, `${rgb[0]} ${rgb[1]} ${rgb[2]}`);
  });
  root.setProperty('--p-hex', pal.hex);
  root.setProperty('--p-hex-dark', pal.hexDark);
  root.setProperty('--p-accent', customAccent || pal.accent);
  root.setProperty('--p-contrast', pal.contrast);
}
function getPrimaryHex(){
  return getComputedStyle(document.documentElement).getPropertyValue('--p-hex').trim() || '#6366f1';
}
function getPrimaryRgbStr(alpha=0.78){
  const [r,g,b] = hexToRgb(getPrimaryHex());
  return `rgba(${r},${g},${b},${alpha})`;
}

let LANG = 'fa';
function t(k){ return (I18N[LANG] && I18N[LANG][k]!==undefined) ? I18N[LANG][k] : (I18N.en[k]!==undefined?I18N.en[k]:k); }

// ---------------- Utils ----------------
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const LETTERS = n => 'ABCDE'.slice(0,n).split('');
function dnum(n){ n=String(n); if(LANG==='fa') n=n.replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]); return n; }
function pct(x,dec=1){ const v=(Math.round((x||0)*10**dec)/10**dec); return dnum(v)+(LANG==='fa'?'٪':'%'); }
function fmtScore(x){ const v=Math.round((x||0)*100)/100; return dnum(Number.isInteger(v)?v:v.toFixed(2)); }
function fmtDate(ts){ try{return new Intl.DateTimeFormat(LANG==='fa'?'fa-IR':'en-US',{year:'numeric',month:'short',day:'numeric'}).format(new Date(ts));}catch(e){return new Date(ts).toLocaleDateString();} }
function fmtDT(ts){ try{return new Intl.DateTimeFormat(LANG==='fa'?'fa-IR':'en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(ts));}catch(e){return new Date(ts).toLocaleString();} }
function fmtDur(sec){ sec=Math.round(sec||0); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; if(h) return dnum(h)+' '+t('hr')+' '+dnum(m)+' '+t('min'); if(m) return dnum(m)+' '+t('min')+' '+dnum(s)+' '+t('sec'); return dnum(s)+' '+t('sec'); }
function fmtClock(sec){ sec=Math.floor(sec); const h=String(Math.floor(sec/3600)).padStart(2,'0'),m=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0'); return dnum(`${h}:${m}:${s}`); }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function accColor(a){ return a>=80?'text-emerald-500':a>=60?'text-amber-500':'text-rose-500'; }
function accBadge(a){ const c=a>=80?'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400':a>=60?'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-400':'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-400'; return `<span class="badge ${c}">${pct(a)}</span>`; }
function downloadFile(name, content, mime='text/plain'){ const b=new Blob([content],{type:mime+';charset=utf-8'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),800); }
function cyrb53(str,seed=7){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (h2>>>0).toString(16)+(h1>>>0).toString(16);}
async function hash(str){ try{ if(window.crypto&&crypto.subtle){ const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); } }catch(e){} return cyrb53(str); }

// ---------------- Domain helpers ----------------
function findBook(bid){ return D.books.find(b=>b.id===bid)||null; }
function findTest(testId){ for(const b of D.books) for(const c of (b.chapters||[])) for(const tt of (c.tests||[])) if(tt.id===testId) return {book:b,chapter:c,test:tt}; return null; }
function findChapter(cid){ for(const b of D.books) for(const c of (b.chapters||[])) if(c.id===cid) return {book:b,chapter:c}; return null; }
function bookQuestionCount(b){ return (b.chapters||[]).reduce((s,c)=>s+(c.tests||[]).reduce((x,tt)=>x+(tt.questionCount||0),0),0); }
function bookTestCount(b){ return (b.chapters||[]).reduce((s,c)=>s+(c.tests||[]).length,0); }
function keyCount(test){ return Object.keys(test.key||{}).length; }
function allTests(){ const out=[]; for(const b of D.books) for(const c of (b.chapters||[])) for(const tt of (c.tests||[])) out.push({book:b,chapter:c,test:tt}); return out; }
function uniqueSubjects(){ return [...new Set(D.books.map(b=>(b.subject||'').trim()).filter(Boolean))]; }
function attemptsForBook(bid){ return D.attempts.filter(a=>a.bookId===bid); }
function attemptsForTest(tid){ return D.attempts.filter(a=>a.testId===tid); }
function aggregate(list){
  const r={tests:list.length,total:0,correct:0,incorrect:0,unanswered:0,answered:0,time:0,score:0,accuracy:0,completion:0,avgScore:0};
  for(const a of list){
    const x=a.results||{};
    r.total+=x.total||0; r.correct+=x.correct||0; r.incorrect+=x.incorrect||0; r.unanswered+=x.unanswered||0;
    r.time+=a.timeSpent||0; r.score+=x.score||0;
  }
  r.answered=r.correct+r.incorrect;
  r.accuracy=r.answered===0?0:r.correct/r.answered*100;
  r.completion=r.total===0?0:r.answered/r.total*100;
  r.avgScore=r.tests?r.score/r.tests:0;
  return r;
}
function gradeCompute(answers,key,total,scoring){
  let correct=0,incorrect=0,unanswered=0,unkeyed=0;
  const detail={};
  for(let i=1;i<=total;i++){
    const a=answers[i];
    if(!key[i]){ detail[i]='unanswered'; unanswered++; if(a) unkeyed++; continue; }
    if(a==null||a===''){ detail[i]='unanswered'; unanswered++; }
    else if(key[i]===a){ detail[i]='correct'; correct++; }
    else { detail[i]='incorrect'; incorrect++; }
  }
  const answered=correct+incorrect;
  const accuracy=answered===0?0:correct/answered*100;
  const completion=total===0?0:answered/total*100;
  let score=correct;
  if(scoring&&scoring.negative){ score=correct-incorrect*(Number(scoring.penalty)||0); }
  return {detail,unkeyed,results:{total,correct,incorrect,unanswered,answered,accuracy,completion,score,maxScore:total}};
}
function chapterAgg(list){
  const m={};
  for(const a of list){
    const det=a.detail||{};
    for(const q in det){
      const cid=(a.qChapters&&a.qChapters[q])||a.chapterId||'__none';
      (m[cid]=m[cid]||{correct:0,incorrect:0,unanswered:0})[det[q]]++;
    }
  }
  return m;
}
function chapterName(cid){ const f=findChapter(cid); return f?{name:f.chapter.title,book:f.book.title,subject:f.book.subject}:null; }

// ---------------- Toast & Modal ----------------
function toast(msg,type='success'){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=icon(type==='error'?'alert':type==='info'?'flag':'check','w-4 h-4')+esc(msg);
  $('#toastRoot').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show'); setTimeout(()=>el.remove(),350);},3200);
}
function openModal(html,wide){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm"><div class="card w-full ${wide?'max-w-3xl':'max-w-md'} max-h-[90vh] overflow-y-auto p-6 anim-scale">${html}</div></div>`;
  const bg=root.firstElementChild;
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) closeModal(); });
  return bg;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }
function confirmDialog(title,msg,okLabel,danger=true){
  return new Promise(res=>{
    const m=openModal(`<div class="text-center"><div class="w-14 h-14 mx-auto rounded-2xl ${danger?'bg-rose-100 dark:bg-rose-500/15 text-rose-500':'bg-indigo-100 dark:bg-indigo-500/15 text-indigo-500'} flex items-center justify-center mb-4">${icon(danger?'alert':'check','w-7 h-7')}</div><h3 class="text-lg font-extrabold mb-2">${esc(title)}</h3><p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">${esc(msg)}</p><div class="flex gap-3 justify-center mt-6"><button id="cfNo" class="btn btn-ghost">${t('cancel')}</button><button id="cfYes" class="btn ${danger?'btn-danger':'btn-primary'}">${esc(okLabel||t('ok'))}</button></div></div>`);
    m.querySelector('#cfNo').onclick=()=>{closeModal();res(false);};
    m.querySelector('#cfYes').onclick=()=>{closeModal();res(true);};
  });
}

function authErr(msg){ const e=$('#authErr'); e.textContent=msg; e.classList.remove('hidden'); }
async function doLogin(){
  const email=$('#aEmail').value.trim().toLowerCase(), pass=$('#aPass').value;
  if(!email||!pass) return authErr(t('fillAll'));
  const btn=$('#aGo'); btn.disabled=true; btn.innerHTML='<span class="animate-pulse">…</span>';
  const users=DB.read('das_users',{});
  const u=Object.values(users).find(x=>x.email===email);
  const h=await hash(pass);
  btn.disabled=false; btn.textContent=t('signIn');
  if(!u||u.pass!==h) return authErr(t('invalidCreds'));
  U=u; DB.write('das_session',u.id); initApp(); toast(t('welcomeBack')+'، '+u.name,'info');
}
async function doRegister(){
  const name=$('#aName').value.trim(), email=$('#aEmail').value.trim().toLowerCase(), p1=$('#aPass').value, p2=$('#aPass2').value;
  if(!name||!email||!p1) return authErr(t('fillAll'));
  if(p1.length<6) return authErr(t('passShort'));
  if(p1!==p2) return authErr(t('passMismatch'));
  const users=DB.read('das_users',{});
  if(Object.values(users).some(x=>x.email===email)) return authErr(t('emailExists'));
  const btn=$('#aGo'); btn.disabled=true;
  const gp=getGlobalPrefs();
  const id=uid();
  users[id]={id,name,email,pass:await hash(p1),createdAt:Date.now(),settings:{theme:document.documentElement.classList.contains('dark')?'dark':'light',lang:LANG,colorPreset:gp.colorPreset||'indigo',primaryColor:gp.primaryColor||'#6366f1',negDefault:false,penaltyDefault:0.25}};
  DB.write('das_users',users);
  DB.write('das_data_'+id,{books:[],attempts:[],drafts:{}});
  DB.write('das_session',id);
  U=users[id]; initApp(); toast(t('accountCreated'),'success');
}
function logout(){ DB.remove('das_session'); U=null;D=null;TS=null; showAuth(); }
function initApp(){
  loadData();
  const st=getSettings();
  LANG=st.lang||'fa';
  applyLang();
  applyTheme(st.theme, st.primaryColor, st.colorPreset);

function bindThemeSettingsEvents(container, isModal=false){
  if(!container) return;
  const saveAndSync = (mode, hex, presetId) => {
    const gp = getGlobalPrefs();
    if(mode) gp.theme = mode;
    if(hex) gp.primaryColor = hex;
    if(presetId) gp.colorPreset = presetId;
    DB.write('das_prefs', gp);
    if(U){
      const st = getSettings();
      if(mode) st.theme = mode;
      if(hex) st.primaryColor = hex;
      if(presetId) st.colorPreset = presetId;
      saveUsers();
    }
    applyTheme(gp.theme, gp.primaryColor, gp.colorPreset);
    if($('#topbar')) renderTopbar();
  };

  container.querySelectorAll('.theme-mode-btn').forEach(btn=>{
    btn.onclick = () => {
      const m = btn.dataset.mode;
      saveAndSync(m, null, null);
      refreshThemeControls(container, isModal);
      if(charts.length) route();
    };
  });

  container.querySelectorAll('.theme-preset-btn').forEach(btn=>{
    btn.onclick = () => {
      const pid = btn.dataset.preset;
      const hex = btn.dataset.hex;
      saveAndSync(null, hex, pid);
      refreshThemeControls(container, isModal);
      toast(t('themeApplied'),'info');
      if(charts.length && !isModal) route();
    };
  });

  const picker = container.querySelector('#tcPicker');
  const hexIn = container.querySelector('#tcHexInput');
  if(picker){
    picker.oninput = e => {
      const val = e.target.value;
      if(hexIn) hexIn.value = val.toUpperCase();
      saveAndSync(null, val, 'custom');
    };
    picker.onchange = () => {
      refreshThemeControls(container, isModal);
      toast(t('themeApplied'),'info');
      if(charts.length && !isModal) route();
    };
  }
  if(hexIn){
    hexIn.oninput = e => {
      let v = e.target.value.trim();
      if(!v.startsWith('#')) v = '#' + v;
      if(/^#[0-9a-fA-F]{6}$/.test(v)){
        if(picker) picker.value = v.toLowerCase();
        saveAndSync(null, v.toLowerCase(), 'custom');
      }
    };
    hexIn.onchange = () => {
      refreshThemeControls(container, isModal);
    };
  }
  const resetBtn = container.querySelector('#tcResetBtn');
  if(resetBtn){
    resetBtn.onclick = () => {
      saveAndSync('light', '#6366f1', 'indigo');
      refreshThemeControls(container, isModal);
      toast(t('themeApplied'),'info');
      if(charts.length && !isModal) route();
    };
  }
  const doneBtn = container.querySelector('#tcDoneBtn');
  if(doneBtn){
    doneBtn.onclick = () => {
      closeModal();
      toast(t('themeApplied'),'success');
      if(U) route();
    };
  }
}

function refreshThemeControls(container, isModal){
  const parent = container.parentElement;
  if(!parent) return;
  parent.innerHTML = buildThemeSettingsWidget(isModal);
  bindThemeSettingsEvents(parent.querySelector('#themeConfigurator'), isModal);
}

function openThemeModal(){
  const m = openModal(`<div>${buildThemeSettingsWidget(true)}</div>`, true);
  bindThemeSettingsEvents(m.querySelector('#themeConfigurator'), true);
}

async function delBook(bid){
  const b=findBook(bid); if(!b) return;
  if(!await confirmDialog(t('areYouSure'),t('confirmDelBook'),t('yesDelete'))) return;
  D.books=D.books.filter(x=>x.id!==bid); saveData(); toast(t('deleted'),'info'); nav('/books'); route();
}
function moveBook(bid,dir){
  const i=D.books.findIndex(b=>b.id===bid); const j=i+dir; if(j<0||j>=D.books.length) return;
  [D.books[i],D.books[j]]=[D.books[j],D.books[i]]; saveData(); route();
}

function chapterForm(bid,cid){
  const b=findBook(bid); const c=cid?b.chapters.find(x=>x.id===cid):null;
  const m=openModal(`<h3 class="text-lg font-extrabold mb-5">${c?t('edit'):t('addChapter')}</h3>
    <div class="mb-4"><label class="label">${t('chapterTitle')} *</label><input id="cfTitle" class="input" value="${esc(c?c.title:'')}"></div>
    <div class="mb-4"><label class="label">${t('notes')}</label><textarea id="cfNotes" class="input" rows="2">${esc(c?c.notes||'':'')}</textarea></div>
    <div class="flex gap-3 justify-end"><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" id="cfSave">${t('save')}</button></div>`);
  m.querySelector('#cfSave').onclick=()=>{
    const title=$('#cfTitle').value.trim(); if(!title) return toast(t('fillAll'),'error');
    if(c){ c.title=title; c.notes=$('#cfNotes').value.trim(); }
    else { b.chapters=b.chapters||[]; b.chapters.push({id:uid(),title,notes:$('#cfNotes').value.trim(),tests:[]}); }

}
async function delChapter(bid,cid){
  if(!await confirmDialog(t('areYouSure'),t('confirmDelChapter'),t('yesDelete'))) return;
  const b=findBook(bid); b.chapters=b.chapters.filter(x=>x.id!==cid); saveData(); toast(t('deleted'),'info'); route();
}
function moveChapter(bid,cid,dir){
  const b=findBook(bid); const i=b.chapters.findIndex(x=>x.id===cid); const j=i+dir; if(j<0||j>=b.chapters.length) return;
  [b.chapters[i],b.chapters[j]]=[b.chapters[j],b.chapters[i]]; saveData(); route();
}

async function delTest(bid,cid,tid){
  if(!await confirmDialog(t('areYouSure'),t('confirmDelTest'),t('yesDelete'))) return;
  const b=findBook(bid); const c=b.chapters.find(x=>x.id===cid);
  c.tests=c.tests.filter(x=>x.id!==tid); delete D.drafts[tid]; saveData(); toast(t('deleted'),'info'); route();
}
function moveTest(bid,cid,tid,dir){
  const b=findBook(bid); const c=b.chapters.find(x=>x.id===cid);
  const i=c.tests.findIndex(x=>x.id===tid); const j=i+dir; if(j<0||j>=c.tests.length) return;
  [c.tests[i],c.tests[j]]=[c.tests[j],c.tests[i]]; saveData(); route();
}

  const cleanKey={}, cleanExp={}, cleanQt={}, cleanCh={};
  for(let i=1;i<=t0.questionCount;i++){

    if(KE.qtext[i]&&KE.qtext[i].trim()) cleanQt[i]=KE.qtext[i].trim();
    if(KE.qch[i]) cleanCh[i]=KE.qch[i];
  }

function importKeyModal(){
  const m=openModal(`<h3 class="text-lg font-extrabold mb-2">${t('importCSV')}</h3><p class="text-xs text-slate-400 mb-3">${t('importKeyHelp')}</p><textarea id="ikTxt" class="input font-mono text-xs" rows="8" dir="ltr" placeholder="1,B,Explanation...&#10;2,D&#10;3,A"></textarea><div class="flex gap-3 justify-end mt-4"><button class="btn btn-ghost" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-primary" id="ikGo">${t('import')}</button></div>`);
  m.querySelector('#ikGo').onclick=()=>{
    const lines=$('#ikTxt').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    let ok=0, maxQ=KE.count;
    for(const ln of lines){
      const parts=ln.split(',');
      const q=parseInt(parts[0]); const ans=(parts[1]||'').trim().toUpperCase();
      if(q>0 && 'ABCDE'.includes(ans) && ans.length===1){
        KE.key[q]=ans; if(parts.slice(2).join(',').trim()) KE.exp[q]=parts.slice(2).join(',').trim();
        if(q>maxQ) maxQ=q; ok++;
      }
    }
    if(!ok) return toast(t('parseErr'),'error');
    KE.count=clamp(maxQ,1,500);
    const kc=$('#keCount'); if(kc) kc.value=KE.count;
    closeModal(); renderKeyGrid(); toast(t('keyImported'));
  };
}
function exportKeyCSV(){
  const rows=[];
  for(let i=1;i<=KE.count;i++) rows.push(`${i},${KE.key[i]||''},${(KE.exp[i]||'').replace(/,/g,';')}`);
  downloadFile((KE.title||'key')+'_key.csv',rows.join('\n'),'text/csv');
}

window.addEventListener('keydown',e=>{
  if(!TS) return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
  const k=e.key.toUpperCase();
  if('ABCDE'.includes(k) && k.length===1){
    const item=TS.practice?TS.items[TS.cur-1]:null;
    const opts=item?item.opts||4:TS.opts;
    if(LETTERS(opts).includes(k)){ e.preventDefault(); selectAnswer(k); }
  } else if(e.key==='ArrowRight'){
    e.preventDefault();
    if(LANG==='fa'){ if(TS.cur>1){ TS.cur--; renderQuestionBox(); renderPalette(); } }
    else { if(TS.cur<TS.total){ TS.cur++; renderQuestionBox(); renderPalette(); } }

    e.preventDefault();
    if(LANG==='fa'){ if(TS.cur<TS.total){ TS.cur++; renderQuestionBox(); renderPalette(); } }

  }

async function submitTestSession(){
  if(!TS) return;
  if(!TS.practice && keyCount(TS.test)===0){
    return toast(t('noKeyErr'),'error');
  }
  const ansCount=Object.keys(TS.answers).filter(k=>TS.answers[k]).length;
  const unans=TS.total-ansCount;
  const msg=unans>0?`${dnum(unans)} ${t('unansweredWarn')}`:t('gradedNote');
  if(!await confirmDialog(t('submitConfirm'),msg,t('submitTest'),false)) return;
  stopTimer();
  let key={}, exp={}, qtext={}, qch={}, scoring={negative:false,penalty:0};
  if(TS.practice){
    TS.items.forEach((it,idx)=>{ key[idx+1]=it.ans; if(it.exp) exp[idx+1]=it.exp; if(it.qtext) qtext[idx+1]=it.qtext; if(it.chapterId) qch[idx+1]=it.chapterId; });
  } else {
    key={...(TS.test.key||{})}; exp={...(TS.test.explanations||{})}; qtext={...(TS.test.questions||{})}; qch={...(TS.test.qChapters||{})}; scoring=TS.test.scoring||{negative:false,penalty:0};
  }
  const g=gradeCompute(TS.answers,key,TS.total,scoring);
  const att={
    id:uid(),
    practice:!!TS.practice,
    testId:TS.practice?null:TS.tid,
    bookId:TS.practice?null:TS.book.id,
    chapterId:TS.practice?null:TS.chapter.id,
    title:TS.title,
    bookTitle:TS.practice?TS.bookTitle:TS.book.title,
    chapterTitle:TS.practice?t('practiceMode'):TS.chapter.title,
    startedAt:TS.startedAt,
    submittedAt:Date.now(),
    timeSpent:TS.timeSpent,
    answers:{...TS.answers},
    marked:{...TS.marked},
    keySnap:key,
    expSnap:exp,
    qSnap:qtext,
    qChapters:qch,
    scoringSnap:scoring,
    detail:g.detail,
    results:g.results
  };
  D.attempts.unshift(att);
  if(!TS.practice) delete D.drafts[TS.tid];
  saveData();
  const id=att.id;
  TS=null;
  toast(t('testSubmitted'),'success');
  nav('/results/'+id);
}

// ---------------- Weakness Analysis ----------------
function renderAnalysis(){
  const v=$('#view');
  if(!D.attempts.length){
    v.innerHTML=`<div class="max-w-3xl mx-auto">${emptyState('pulse',t('analysis'),t('notEnoughData'),`<button class="btn btn-primary" onclick="quickStartModal()">${icon('play','w-4 h-4')}${t('startNewTest')}</button>`)}</div>`;
    return;
  }
  const cAgg=chapterAgg(D.attempts);
  const chList=Object.entries(cAgg).map(([cid,a])=>{
    const info=chapterName(cid); const ans=a.correct+a.incorrect;
    return {cid,info,ans,err:ans?a.incorrect/ans*100:0,acc:ans?a.correct/ans*100:0,incorrect:a.incorrect};
  }).filter(x=>x.info&&x.ans>=1).sort((x,y)=>y.err-x.err);

  const missed=[];
  D.attempts.forEach(a=>{
    for(const q in a.detail){
      if(a.detail[q]==='incorrect'){
        missed.push({ans:a.keySnap&&a.keySnap[q],exp:a.expSnap&&a.expSnap[q],qtext:a.qSnap&&a.qSnap[q],chapterId:(a.qChapters&&a.qChapters[q])||a.chapterId,opts:5,source:`${a.title} #${q}`,bookTitle:a.bookTitle});
      }
    }
  });

  v.innerHTML=`<div class="max-w-6xl mx-auto space-y-6">
    <div class="card p-6 anim flex flex-wrap items-center justify-between gap-4">
      <div>
        <h2 class="text-lg font-extrabold">${t('practiceFromMistakes')}</h2>
        <p class="text-xs text-slate-400">${dnum(missed.length)} ${t('incorrect')}</p>
      </div>
      <button class="btn btn-primary" id="anPractice" ${!missed.length?'disabled':''}>${icon('play','w-4 h-4')}${t('practiceFromMistakes')}</button>
    </div>

    <div class="card p-6 anim">
      <h3 class="font-extrabold mb-4">${t('weakChapters')}</h3>
      ${chList.length?`<div class="space-y-3">${chList.map(x=>`<div class="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-900/50 flex flex-wrap items-center gap-4">
        <div class="flex-1 min-w-[180px]"><div class="font-bold text-sm">${esc(x.info.name)}</div><div class="text-xs text-slate-400">${esc(x.info.book)}</div></div>
        <div class="w-40">${bar(x.acc,x.acc>=80?'#10b981':x.acc>=60?'#f59e0b':'#f43f5e')}</div>
        <span class="text-xs font-bold text-rose-500">${t('errorRate')}: ${pct(x.err,0)}</span>
      </div>`).join('')}</div>`:`<p class="text-sm text-slate-400">${t('noMistakes')}</p>`}
    </div>
  </div>`;

  const btn=$('#anPractice');
  if(btn) btn.onclick=()=>{
    sessionStorage.setItem('das_practice',JSON.stringify({title:t('practiceSession'),bookTitle:t('multiple'),items:missed.slice(0,30)}));
    nav('/practice');
  };
}

function printBlankSheet(tid){
  const f=findTest(tid); if(!f) return;
  const tt=f.test; const letters=LETTERS(tt.optionsCount||4);
  let rows='';
  for(let i=1;i<=tt.questionCount;i++){
    rows+=`<div class="bs-row"><b>${dnum(i)}.</b><div>${letters.map(L=>`<span class="bs-b">${L}</span>`).join('')}</div></div>`;
  }
  $('#printArea').innerHTML=`<div style="padding:20px;font-family:'Vazirmatn','Inter',sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #000;padding-bottom:10px">
      <div><h1 style="font-size:20px;font-weight:800;margin:0">${esc(t('appName'))} (Test Yar) — ${esc(tt.title)}</h1><p style="font-size:12px;margin:2px 0 0">${esc(f.book.title)} • ${esc(f.chapter.title)}</p></div>
      <div style="font-size:12px"><div>${t('blankSheetName')}: ___________________</div><div style="margin-top:4px">${t('blankSheetDate')}: ___________________</div></div>
    </div>
    <div class="bs-grid">${rows}</div>
  </div>`;
  document.body.classList.add('print-blank');
  window.print();
  setTimeout(()=>document.body.classList.remove('print-blank'),500);
}
